name: build-apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Signed AAB to Play internal track
    runs-on: ubuntu-latest
    if: hashFiles('packages/android/gradlew') != ''
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_ANDROID: ${{ secrets.SENTRY_PROJECT_ANDROID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > packages/android/release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/packages/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        working-directory: packages/android
        run: ./gradlew bundleRelease

      - name: Upload AAB to Play internal track
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.notes
          releaseFiles: packages/android/app/build/outputs/bundle/release/app-release.aab
          track: internal

      - name: Upload ProGuard mapping to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          pnpm dlx @sentry/cli@2 upload-proguard \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_ANDROID" \
            packages/android/app/build/outputs/mapping/release/mapping.txt
