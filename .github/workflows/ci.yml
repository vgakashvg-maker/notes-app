name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Lint, type-check, unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Format check
        run: pnpm format:check

  jvm:
    name: Kotlin tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cache wrapper + dependencies)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: packages/android
        run: chmod +x ./gradlew

      - name: Gradle test
        working-directory: packages/android
        run: ./gradlew test --stacktrace --console=plain

      - name: Publish JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-junit
          path: packages/android/**/build/test-results/**/*.xml
          if-no-files-found: ignore
